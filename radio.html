<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071310"><title>TAMJ TV — Live Radio</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#e6f5ef;background:#071310}*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:65px minmax(0,1fr);min-height:100vh}aside{background:#071613;border-right:1px solid #24483f;padding:15px 5px;display:flex;flex-direction:column;align-items:center;gap:25px;position:sticky;top:0;height:100vh}aside .brand{font-size:25px;color:#5ae6c4}nav{display:grid;gap:20px;text-align:center}nav a{font-size:23px;color:#9ebcb3;text-decoration:none}nav a span{display:block;font-size:10px}nav a.active{color:#53ebc6}main{padding:24px clamp(12px,3vw,40px);min-width:0}h1{margin:0 0 6px;font-size:clamp(23px,3vw,34px)}p{color:#9bbab0}header{margin-bottom:12px}header p{margin:6px 0 0;font-size:14px}.panel{background:#0e211d;border:1px solid #285045;border-radius:15px;padding:20px;margin:14px 0}.player{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.player-panel{background:linear-gradient(135deg,#103c32,#0b201c 72%);padding:22px}.player-actions{display:flex;align-items:center;gap:12px;margin-top:17px;flex-wrap:wrap}.player-actions label{display:flex;align-items:center;gap:9px;color:#a5cfc2;font-size:13px}.player-actions input{width:130px;padding:0;accent-color:#42d9b3}.live-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #326a5a;border-radius:999px;padding:5px 10px;color:#75ebc8;font-size:11px;font-weight:800;letter-spacing:.08em}.live-dot{width:7px;height:7px;border-radius:50%;background:#42d9b3}.radio-subtitle{font-size:12px;color:#a5cfc2;margin:4px 0 0}.station .fallback,.station img{flex-shrink:0}.station{padding:11px 12px}.station small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tools{align-items:center}.cover{width:112px;height:112px;flex-shrink:0;display:grid;place-items:center;background:#123b32;border-radius:14px;color:#6ef3d3;font-size:46px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:contain}.playerinfo{flex:1;min-width:150px}.playerinfo strong{font-size:22px}button,input,select{font:inherit}button{cursor:pointer;background:#123e34;color:#dcfff5;border:1px solid #397867;border-radius:10px;padding:10px 14px}button.primary{background:#42d9b3;color:#042019;font-weight:800;border:0}button:disabled{opacity:.5;cursor:default}input,select{background:#102b25;color:#f1fffa;border:1px solid #366459;padding:12px;border-radius:10px;max-width:100%}.tools{display:flex;gap:10px;flex-wrap:wrap}.tools input{flex:1;min-width:160px}.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:18px}.station{background:#0e211d;border:1px solid #285045;border-radius:13px;padding:14px;text-align:left;display:flex;align-items:center;gap:12px;min-width:0}.station:hover,.station.selected{border-color:#54e5c2;background:#17382f}.station img,.station .fallback{width:46px;height:46px;object-fit:contain;border-radius:8px;background:#143b32}.station .fallback{display:grid;place-items:center;font-size:23px}.station strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.station small{color:#a1c5b9}#status{font-size:12px;min-height:18px;color:#b3d4c8}audio{display:none}@media(max-width:560px){.layout{grid-template-columns:49px minmax(0,1fr)}aside{padding:12px 2px}nav a{font-size:20px}main{padding:16px 10px}.panel{padding:13px}.cover{width:82px;height:82px}.player{gap:12px}.playerinfo strong{font-size:18px}.player-panel{padding:14px}.player-actions{margin-top:13px}.player-actions input{width:100px}.stations{grid-template-columns:1fr}.station{padding:10px 12px}}</style></head><body><div class="layout"><aside><div class="brand">◈</div><nav><a href="index.html" title="Live TV">▣<span>Live TV</span></a><a href="movies.html" title="Movies">▤<span>Movies</span></a><a class="active" href="radio.html" title="Radio">♫<span>Radio</span></a></nav></aside><main><header><h1>♫ TAMJ Live Radio</h1><p>Listen to your favorite stations, selected by TAMJ TV.</p></header><section class="panel player-panel"><div class="player"><div id="cover" class="cover">♫</div><div class="playerinfo"><strong id="playingName">Choose a station</strong><p id="playingMeta" class="radio-subtitle">Live music, news and talk</p><div style="margin-top:10px"><span class="live-pill"><span class="live-dot"></span> LIVE RADIO</span></div><div id="status" role="status" aria-live="polite" style="margin-top:10px">Ready</div></div></div><div class="player-actions"><button id="toggle" class="primary" disabled aria-label="Play or pause radio">▶ Play</button><label for="volume">🔊 Volume <input id="volume" type="range" min="0" max="100" value="85" aria-label="Radio volume"></label></div><audio id="audio" preload="none"></audio></section><section class="panel"><div class="tools"><input id="search" placeholder="Search radio stations..." aria-label="Search radio stations"><select id="category" aria-label="Radio category"><option value="">All categories</option></select></div><p id="count"></p><div id="stations" class="stations"></div></section></main></div><script>let stations=[],selected=null,hls=null;const $=id=>document.getElementById(id),audio=$('audio');audio.volume=.85;$('volume').oninput=e=>{audio.volume=Number(e.target.value)/100};function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value;const list=stations.filter(x=>(!cat||x.category===cat)&&[x.name,x.category,x.country].join(' ').toLowerCase().includes(q));$('count').textContent=list.length+' stations';$('stations').innerHTML=list.map(x=>`<button class="station ${selected?.id===x.id?'selected':''}" data-id="${safe(x.id)}">${x.logo?`<img src="${safe(x.logo)}" alt="" loading="lazy">`:'<span class="fallback">♫</span>'}<span style="min-width:0"><strong>${safe(x.name)}</strong><small>${safe(x.category)}${x.country?' · '+safe(x.country):''}</small></span></button>`).join('')||'<p>No stations available in this category.</p>'}function stop(){audio.pause();audio.removeAttribute('src');audio.load();if(hls){hls.destroy();hls=null}}async function choose(x){stop();selected=x;$('cover').innerHTML=x.logo?`<img src="${safe(x.logo)}" alt="">`:'♫';$('playingName').textContent=x.name;$('playingMeta').textContent=[x.category,x.country].filter(Boolean).join(' · ');$('toggle').disabled=false;$('status').textContent='Connecting...';render();const u=x.url;if(/\.m3u8(?:[?#]|$)/i.test(u)&&!audio.canPlayType('application/vnd.apple.mpegurl')){try{if(!window.Hls){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}if(window.Hls?.isSupported()){hls=new Hls();hls.loadSource(u);hls.attachMedia(audio)}else{audio.src=u}}catch(e){$('status').textContent='HLS player could not load';return}}else audio.src=u;try{await audio.play()}catch(e){$('status').textContent='Press Play to start audio'}}$('stations').onclick=e=>{const b=e.target.closest('[data-id]');if(b){const x=stations.find(s=>s.id===b.dataset.id);if(x)choose(x)}};$('toggle').onclick=()=>{if(audio.paused)audio.play().catch(()=>$('status').textContent='Unable to play this stream');else audio.pause()};audio.onplaying=()=>{$('status').textContent='Now playing';$('toggle').textContent='Ⅱ Pause'};audio.onpause=()=>{$('toggle').textContent='▶ Play';if(selected)$('status').textContent='Paused'};audio.onerror=()=>{$('status').textContent='Stream unavailable or blocked by browser'};$('search').oninput=render;$('category').onchange=render;fetch('/api/data',{cache:'no-store'}).then(r=>r.json()).then(d=>{stations=(d.radio_stations||[]).filter(x=>x.enabled);for(const cat of [...new Set(stations.map(x=>x.category).filter(Boolean))].sort()){const o=document.createElement('option');o.value=cat;o.textContent=cat;$('category').appendChild(o)}render()}).catch(()=>{$('count').textContent='Could not load radio stations'});</script></body></html>
