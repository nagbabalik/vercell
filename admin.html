<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAMJ TV Admin</title><style>:root{font-family:system-ui;color:#e9fff6;background:#071613}*{box-sizing:border-box}body{margin:0}header{padding:18px;background:#0e2822;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:24px}section{background:#0d2822;border:1px solid #245347;border-radius:16px;padding:20px;margin:18px 0}input,select,textarea,button{font:inherit;background:#12392f;color:white;border:1px solid #3b7a66;border-radius:9px;padding:10px;max-width:100%}input,textarea{width:100%}label{display:block;font-size:13px;color:#add5c6;margin:12px 0 5px}button{cursor:pointer}button.primary{background:#36d6aa;color:#04251b;font-weight:800}nav{display:flex;gap:8px;flex-wrap:wrap}nav button.active{background:#36d6aa;color:#05241b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.item{padding:12px;border-bottom:1px solid #285449;display:flex;align-items:center;justify-content:space-between;gap:10px}.item div{overflow-wrap:anywhere}.muted{color:#9ebeb3;font-size:13px}#message{min-height:22px;color:#70e6c2}@media(max-width:550px){main{padding:10px}.item{display:block}.item button{margin:4px}}</style><header><strong>◈ TAMJ IPTV PRO — ADMIN</strong><a href="index.html" style="color:#6ee8c4">Live TV</a></header><main><h1>Content management</h1><p id="message"></p><section id="login"><h2>Admin login</h2><label>Username</label><input id="username" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><p><button class="primary" onclick="login()">Sign in</button></p></section><div id="panel" hidden><nav id="tabs"></nav><section><h2 id="heading"></h2><div id="items"></div></section><section><h2>Add / Edit</h2><form id="editor"><div id="fields" class="grid"></div><p><button class="primary" type="submit">Save changes</button> <button type="button" onclick="resetForm()">Clear</button> <button type="button" onclick="logout()">Logout</button></p></form></section><p class="muted">Changes are committed to the configured GitHub repository. Vercel redeploys may take time; the API reads GitHub content directly.</p></div></main><script src="admin-ui.js"></script></html>
